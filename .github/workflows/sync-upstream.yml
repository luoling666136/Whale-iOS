name: 一键同步上游更新

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 每周自动检查一次

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 添加上游仓库并获取更新
        run: |
          git remote add upstream https://github.com/whale-Yd00/freeapp.git 2>/dev/null || true
          git fetch upstream

      - name: 检查是否有更新
        id: check-update
        run: |
          BEHIND=$(git rev-list --count main..upstream/main 2>/dev/null || echo "0")
          echo "上游新提交数: $BEHIND"
          echo "has_update=$([ "$BEHIND" -gt 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: 合并上游更新
        if: steps.check-update.outputs.has_update == 'true'
        id: merge
        run: |
          if git merge upstream/main --no-edit 2>&1; then
            echo "✅ 合并成功"
            echo "merge_status=ok" >> $GITHUB_OUTPUT
          else
            # 冲突时：www 目录跟随上游，恢复我们自定义的文件
            echo "⚠️ 出现冲突，尝试自动解决..."
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            echo "冲突文件: $CONFLICTS"
            # 自动解决：所有冲突文件采用上游版本，然后恢复我们的自定义文件
            for f in $CONFLICTS; do
              case "$f" in
                www/manifest.json|README.md|package.json|.gitignore)
                  echo "保留本地版本: $f"
                  git checkout --ours "$f"
                  ;;
                *)
                  echo "采用上游版本: $f"
                  git checkout --theirs "$f"
                  ;;
              esac
              git add "$f"
            done
            git commit --no-edit
            echo "✅ 冲突已自动解决"
            echo "merge_status=ok" >> $GITHUB_OUTPUT
          fi

      - name: 重新生成依赖
        if: steps.merge.outputs.merge_status == 'ok'
        run: npm install

      - name: 推送到 GitHub
        if: steps.merge.outputs.merge_status == 'ok'
        run: git push origin main

      - name: 同步 www 到 gh-pages 分支（GitHub 会自动重新部署）
        if: steps.merge.outputs.merge_status == 'ok'
        run: |
          git subtree split --prefix www -b gh-pages-sync 2>/dev/null
          git push origin gh-pages-sync:gh-pages --force
          git branch -D gh-pages-sync
